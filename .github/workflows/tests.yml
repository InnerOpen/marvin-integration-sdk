name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: MarvinIntegrationSDK
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Test
        working-directory: MarvinIntegrationSDK
        run: uv run --extra dev pytest -q
      - name: Lint
        working-directory: MarvinIntegrationSDK
        run: uv run --extra dev ruff check .
