[project]
name = "marvin-integration-sdk"
version = "0.1.0"
description = "Contract SDK for Marvin integration providers — base classes, registry, and the http helper interface. Zero heavy dependencies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marvin_integration_sdk"]

[tool.ruff]
line-length = 150
target-version = "py311"
